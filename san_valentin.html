<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>¿Quieres ser mi San Valentín?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #fff;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 420px;
    }

    .heart {
      font-size: 3rem;
      animation: pulse 1.5s infinite;
      margin-bottom: 10px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .photo {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      margin: 15px auto 25px;
      display: block;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      border: 4px solid rgba(255,255,255,0.6);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
    }

    button {
      padding: 12px 25px;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    #yes {
      background: #ff3366;
      color: white;
      z-index: 2;
    }

    #yes:hover {
      background: #ff1f5a;
      transform: scale(1.1);
    }

    #no {
      background: #ffffff;
      color: #ff3366;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>

    <img src="foto.jpg" alt="Mi princesa bella" class="photo">

    <h1>💖 AMOCHITO BELLO 💖<br>¿Quieres ser mi San Valentín? 💘</h1>

    <p>
      Prometo cuidarte 🫶, hacerte reír 😂 y amarte cada día más 💕.<br>
      Eres mi alegría, mi calma y mi lugar seguro ✨👑
    </p>

    <div class="buttons">
      <button id="yes" onclick="aceptar()">Sí 💕</button>
      <button id="no" onmouseover="moverNo()">No 😅</button>
    </div>
  </div>

  <script>
    function aceptar() {
      alert('💍 TE AMO POR SIEMPRE Y PARA SIEMPRE 💖\nMI PRINCESA BELLA 👑✨\nSiempre tú, siempre nosotros ❤️');
    }

    function moverNo() {
      const btn = document.getElementById('no');
      const x = Math.random() * 120 - 60;
      const y = Math.random() * 40 - 20;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
